name: Render and deploy site

on:
  push:
    branches: main
  pull_request:
    branches: main
  # to be able to trigger a manual build
  workflow_dispatch:

# Needed so GITHUB_TOKEN can push to the gh-pages branch
permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # Set before renv runs 
      RENV_CONFIG_SANDBOX_ENABLED: "FALSE"
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          # use the R version recorded in renv.lock (commit the updated
          # lockfile first, so this becomes 4.6.0)
          r-version: renv

      - name: Install system libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcurl4-openssl-dev libharfbuzz-dev \
            libfribidi-dev libglpk-dev libgmp3-dev libxml2-dev

      - uses: r-lib/actions/setup-renv@v2

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Deploy 🚀
        # only deploy on push to main, not on pull requests
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          # Adapt if you changed output-dir in _quarto.yml
          folder: _site